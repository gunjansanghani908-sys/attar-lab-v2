<!-- DUAL CHECKOUT FORM (RAZORPAY + COD) -->
<div class="bg-panelBg/95 border-2 border-goldPrimary/40 rounded-2xl p-4 sm:p-5 text-left shadow-2xl space-y-3">
  <div class="flex items-center justify-between border-b border-white/10 pb-2">
    <span class="text-xs font-mono text-goldLight font-bold uppercase tracking-wider">
      ★ ડિલિવરી સરનામું અને પેમેન્ટ
    </span>
    <div class="text-right">
      <span class="text-xs text-gray-400 line-through mr-1">₹899</span>
      <span class="text-lg font-black text-goldLight" id="displayAmount">₹599</span>
    </div>
  </div>

  <!-- Form Fields -->
  <div class="space-y-2.5 pt-1">
    <div>
      <label class="block text-[11px] text-gray-400 font-bold uppercase mb-1">પૂરું નામ *</label>
      <input type="text" id="custName" placeholder="દા.ત. રાહુલ શાહ" class="w-full bg-black/60 border border-white/15 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-goldPrimary">
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="block text-[11px] text-gray-400 font-bold uppercase mb-1">મોબાઈલ નંબર *</label>
        <input type="tel" id="custPhone" placeholder="10 આંકડાનો નંબર" maxlength="10" class="w-full bg-black/60 border border-white/15 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-goldPrimary">
      </div>
      <div>
        <label class="block text-[11px] text-gray-400 font-bold uppercase mb-1">પિનકોડ *</label>
        <input type="text" id="custPincode" placeholder="6 આંકડાનો પિનકોડ" maxlength="6" class="w-full bg-black/60 border border-white/15 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-goldPrimary">
      </div>
    </div>

    <div>
      <label class="block text-[11px] text-gray-400 font-bold uppercase mb-1">ઘરનું પૂરું સરનામું *</label>
      <textarea id="custAddress" rows="2" placeholder="ઘર/ફ્લેટ નં, સોસાયટી, રોડ, શહેર" class="w-full bg-black/60 border border-white/15 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-goldPrimary"></textarea>
    </div>

    <!-- PAYMENT METHOD SELECTOR -->
    <div class="pt-2">
      <label class="block text-[11px] text-goldLight font-bold uppercase mb-2">પેમેન્ટ પદ્ધતિ પસંદ કરો:</label>
      
      <div class="space-y-2">
        <!-- Option 1: Razorpay / Prepaid -->
        <label class="flex items-center justify-between p-3 rounded-xl border border-goldPrimary/40 bg-black/40 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <input type="radio" name="payMethod" value="ONLINE" checked onchange="togglePayMode('ONLINE')" class="accent-goldPrimary">
            <div>
              <div class="text-sm font-bold text-white">ઓનલાઇન પેમેન્ટ (UPI / GPay / Cards)</div>
              <div class="text-[11px] text-emerald-400">ઝડપી ડિસ્પેચ + સુરક્ષિત પેમેન્ટ</div>
            </div>
          </div>
          <span class="text-xs font-mono text-goldLight font-bold">₹599</span>
        </label>

        <!-- Option 2: Cash on Delivery -->
        <label class="flex items-center justify-between p-3 rounded-xl border border-white/10 bg-black/40 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <input type="radio" name="payMethod" value="COD" onchange="togglePayMode('COD')" class="accent-goldPrimary">
            <div>
              <div class="text-sm font-bold text-white">કેશ ઓન ડિલિવરી (COD)</div>
              <div class="text-[11px] text-gray-400">ઘરે પાર્સલ આવે ત્યારે જ રોકડા આપો</div>
            </div>
          </div>
          <span class="text-xs font-mono text-gray-300 font-bold">₹599</span>
        </label>
      </div>
    </div>
  </div>

  <!-- ACTION BUTTON -->
  <button id="mainSubmitBtn" type="button" onclick="labApp.handleCheckout()" class="btn-pay w-full py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 text-black font-black text-base tracking-wide mt-3">
    <span id="btnActionText">₹૫૯૯ ઓનલાઇન ચૂકવો (GPay / UPI)</span>
  </button>

  <div class="text-[11px] text-gray-400 text-center flex items-center justify-center gap-2 pt-1 font-mono">
    <span>🔒 100% સુરક્ષિત ઓર્ડર</span>
    <span>•</span>
    <span>ઓલ ઇન્ડિયા ડિલિવરી</span>
  </div>
</div>
